services:
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    volumes:
      - redis_cache:/data
    restart: unless-stopped
    networks:
      - agent_framework
      - n8n_external_network

  mongodb:
    image: mongo:7.0
    container_name: chatbot-mongodb
    restart: always
    env_file:
      - .env
    ports:
      - "27017:27017"
    networks:
      - agent_framework
      - n8n_external_network
    volumes:
      - mongodb_data:/data/db
    command: ["mongod", "--auth"]
    healthcheck:
      test: "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2
    container_name: mongo-express
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - agent_framework
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_AUTH_DATABASE: admin
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGOEXPRESS_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGOEXPRESS_BASICAUTH_PASSWORD}

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-vector-db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - agent_framework
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && echo -e 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  docling-serve:
    image: ghcr.io/docling-project/docling-serve-cpu:latest
    container_name: docling-serve
    ports:
      - "5001:5001"
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ocr_cache:/root/.EasyOCR
    environment:
      DOCLING_SERVE_ENABLE_UI: "1"
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "true"
      LOG_LEVEL: "INFO"
    restart: unless-stopped
    networks:
      - agent_framework
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mcp-server:
    build:
      context: .
      dockerfile: mcp_service/Dockerfile.mcpserver
    container_name: mcpserver-fastmcp
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_healthy
    networks:
      - agent_framework
      - n8n_external_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: mongodb-fastapi
    ports:
      - "8001:8001"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - agent_framework
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  chat_agents:
    build:
      context: .
      dockerfile: Dockerfile.chatapp
    container_name: chat-agents
    ports:
      - "8501:8501"
    depends_on:
      mcp-server:
        condition: service_healthy
      docling-serve:
        condition: service_healthy
    networks:
      - agent_framework
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_cache:
  mongodb_data:
  hf_cache:
  ocr_cache:

networks:
  agent_framework:
    driver: bridge
  n8n_external_network:
    driver: bridge

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: send all non-file routes to index.html so react-router works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (they're content-hashed by Vite).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # location ~ ^/(session|sessions|chat|message|documents|users|admin|metrics)(/|$) {
    #     proxy_pass http://backend:8001;
    # }
}
